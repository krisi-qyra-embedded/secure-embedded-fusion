<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1600" viewBox="0 0 1840 1600" role="img" aria-labelledby="title desc">
<title id="title">Secure STM32–ESP32 IoT Sensor Platform — system architecture</title><desc id="desc">STM32 secure boot enables supervised sensor acquisition. Directional P-256 and SHA-256 key derivation support a full-duplex AES-256-GCM UART link. The ESP32 validates data and runs either AWS MQTT over TLS or local HTTPS with ESP32 OTA. Watchdog supervision connects bounded recovery to reboot and repeated firmware verification.</desc>
<rect width="1840" height="1600" fill="#091629"/>
<defs>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6cb9ff"/></marker>
<marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#79dbc3"/></marker>
<marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b2c7e0"/></marker>
</defs><g font-family="DejaVu Sans, sans-serif">
<text x="60" y="63" font-size="43" font-weight="500" fill="#e8f2ff" text-anchor="start">Secure STM32–ESP32 IoT Sensor Platform</text>
<text x="60" y="104" font-size="23" font-weight="400" fill="#b2c7e0" text-anchor="start">Verified startup  /  Supervised acquisition  /  Authenticated telemetry  /  Local and cloud monitoring</text>
<rect x="60" y="160" width="810" height="245" rx="16" fill="#10243d" stroke="#355570" stroke-width="1.5"/>
<text x="88" y="195" font-size="20" font-weight="500" fill="#6cb9ff" text-anchor="start">STM32 STARTUP</text>
<text x="88" y="238" font-size="29" font-weight="500" fill="#e8f2ff" text-anchor="start">Verify before application execution</text>
<text x="88" y="277" font-size="23" font-weight="400" fill="#b2c7e0" text-anchor="start">OTP public key → Ed25519 verification of the signed manifest</text>
<text x="88" y="309" font-size="23" font-weight="400" fill="#b2c7e0" text-anchor="start">Application SHA-256 → compare with the manifest hash</text>
<text x="88" y="341" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">MSP + reset handler checks → stop SysTick, clear IRQs, set VTOR</text>
<text x="88" y="384" font-size="21" font-weight="400" fill="#b2c7e0" text-anchor="start">App: 0x08020000–0x0805FFFF  ·  Manifest: 0x08060000</text>
<rect x="970" y="160" width="810" height="245" rx="16" fill="#10243d" stroke="#355570" stroke-width="1.5"/>
<text x="998" y="195" font-size="20" font-weight="500" fill="#6cb9ff" text-anchor="start">CRYPTOGRAPHIC SETUP</text>
<text x="998" y="238" font-size="29" font-weight="500" fill="#e8f2ff" text-anchor="start">Separate keys for each UART direction</text>
<text x="998" y="277" font-size="23" font-weight="400" fill="#b2c7e0" text-anchor="start">Provisioned P-256 ECDH material → SHA-256 key derivation</text>
<text x="998" y="309" font-size="23" font-weight="400" fill="#b2c7e0" text-anchor="start">AES-256-GCM: 12-byte nonce + ciphertext + 16-byte tag</text>
<text x="998" y="341" font-size="23" font-weight="400" fill="#b2c7e0" text-anchor="start">Fresh nonce per encryption attempt; nonce state persists across</text>
<text x="998" y="373" font-size="23" font-weight="400" fill="#b2c7e0" text-anchor="start">resets</text>
<rect x="60" y="460" width="810" height="425" rx="16" fill="#10243d" stroke="#355570" stroke-width="1.5"/>
<text x="88" y="495" font-size="20" font-weight="500" fill="#6cb9ff" text-anchor="start">STM32F411RE · CMSIS / HAL · FREERTOS</text>
<text x="88" y="538" font-size="29" font-weight="500" fill="#e8f2ff" text-anchor="start">Sensor acquisition and encrypted telemetry</text>
<rect x="87" y="562" width="310" height="294" rx="16" fill="#142f4e" stroke="#355570" stroke-width="1.5"/>
<text x="109" y="597" font-size="25" font-weight="500" fill="#e8f2ff" text-anchor="start">Sensor bank</text>

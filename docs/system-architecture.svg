<text x="482" y="439" font-size="18" font-weight="400" fill="#b2c7e0" text-anchor="start">both checks pass</text>
<rect x="970" y="460" width="810" height="425" rx="16" fill="#10243d" stroke="#355570" stroke-width="1.5"/>
<text x="998" y="495" font-size="20" font-weight="500" fill="#6cb9ff" text-anchor="start">ESP32 · MBEDTLS · FREERTOS</text>
<text x="998" y="538" font-size="29" font-weight="500" fill="#e8f2ff" text-anchor="start">Authenticate before accepting telemetry</text>
<text x="998" y="572" font-size="24" font-weight="400" fill="#b2c7e0" text-anchor="start">GCM authentication and decryption</text>
<text x="998" y="617" font-size="24" font-weight="400" fill="#b2c7e0" text-anchor="start">Format, replay freshness and parsing checks</text>
<text x="998" y="662" font-size="24" font-weight="400" fill="#b2c7e0" text-anchor="start">Accepted snapshot updates only after validation</text>
<text x="998" y="707" font-size="24" font-weight="400" fill="#b2c7e0" text-anchor="start">Encrypted ACK/NACK carries the request sequence</text>
<text x="998" y="752" font-size="24" font-weight="400" fill="#b2c7e0" text-anchor="start">STM32 data combines with local ESP32 readings</text>
<text x="998" y="846" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Rejected packets leave accepted telemetry unchanged.</text>

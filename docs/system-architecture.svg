<text x="921" y="583" font-size="17" font-weight="500" fill="#6cb9ff" text-anchor="middle">USART6</text>
<path d="M 876 624 H 963" fill="none" stroke="#6cb9ff" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
<text x="922" y="610" font-size="17" font-weight="500" fill="#6cb9ff" text-anchor="middle">DATA</text>
<path d="M 965 691 H 876" fill="none" stroke="#79dbc3" stroke-width="2.5" marker-end="url(#green-arrow)"/>
<text x="922" y="725" font-size="17" font-weight="500" fill="#79dbc3" text-anchor="middle">ACK</text>
<text x="922" y="751" font-size="15" font-weight="400" fill="#79dbc3" text-anchor="middle">/ NACK</text>
<rect x="60" y="954" width="810" height="375" rx="16" fill="#10243d" stroke="#355570" stroke-width="1.5"/>
<text x="88" y="989" font-size="20" font-weight="500" fill="#6cb9ff" text-anchor="start">STM32 HEALTH AND RECOVERY</text>
<text x="88" y="1032" font-size="29" font-weight="500" fill="#e8f2ff" text-anchor="start">Progress gates the independent watchdog</text>
<text x="88" y="1068" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Sensor fault → peripheral / sensor recovery, up to 3 attempts</text>
<text x="88" y="1102" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">UART timeout / rejection → up to 3 transaction attempts</text>
<text x="88" y="1136" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Retry uses a fresh nonce and retains the request sequence</text>
<text x="88" y="1170" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Supervisor checks sensor and communication heartbeats</text>
<text x="88" y="1204" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Driver activity and successful sensor readings are distinct</text>
<text x="88" y="1238" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Healthy system → refresh IWDG; persistent fault → stop refresh</text>
<text x="88" y="1272" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Watchdog reset → repeat secure boot before restarting</text>
<path d="M 465 886 V 947" fill="none" stroke="#b2c7e0" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#muted-arrow)"/>
<text x="481" y="930" font-size="19" font-weight="400" fill="#b2c7e0" text-anchor="start">heartbeats + fault reports</text>
<path d="M 61 1240 H 27 V 275 H 52" fill="none" stroke="#79dbc3" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green-arrow)"/>
<rect x="970" y="954" width="810" height="375" rx="16" fill="#10243d" stroke="#355570" stroke-width="1.5"/>
<text x="998" y="989" font-size="20" font-weight="500" fill="#6cb9ff" text-anchor="start">ESP32 NETWORK MODE CONTROL</text>
<text x="998" y="1032" font-size="29" font-weight="500" fill="#e8f2ff" text-anchor="start">Orderly switching manages TLS memory</text>
<text x="998" y="1061" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">AP client present: stop AWS → start local HTTPS</text>
<text x="998" y="1090" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Last AP client leaves: stop HTTPS → restart AWS when STA is ready</text>

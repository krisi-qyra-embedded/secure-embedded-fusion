<text x="1409" y="1266" font-size="21" font-weight="400" fill="#b2c7e0" text-anchor="start">TLS server certificate</text>
<text x="998" y="1311" font-size="21" font-weight="400" fill="#b2c7e0" text-anchor="start">ESP32 supervisor monitors network task health.</text>

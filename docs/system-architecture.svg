<text x="109" y="797" font-size="16" font-weight="400" fill="#b2c7e0" text-anchor="start">PM1.0 / PM2.5 / PM10 / counts</text>
<text x="109" y="820" font-size="21" font-weight="500" fill="#e8f2ff" text-anchor="start">DS18B20 × 5 · 1-Wire</text>
<text x="109" y="844" font-size="16" font-weight="400" fill="#b2c7e0" text-anchor="start">Temperature</text>
<rect x="455" y="562" width="388" height="294" rx="16" fill="#142f4e" stroke="#355570" stroke-width="1.5"/>
<text x="480" y="597" font-size="23" font-weight="500" fill="#e8f2ff" text-anchor="start">Task / peripheral coordination</text>
<text x="480" y="639" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Dedicated sensor tasks</text>
<text x="480" y="673" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">DMA IRQ → binary semaphore</text>
<text x="480" y="707" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Bounded transfer waits</text>
<text x="480" y="741" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">Queues → telemetry snapshot</text>
<text x="480" y="775" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">USART2 logging mutex</text>
<text x="480" y="809" font-size="22" font-weight="400" fill="#b2c7e0" text-anchor="start">CMOX AES-256-GCM</text>

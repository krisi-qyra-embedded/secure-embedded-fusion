<text x="109" y="679" font-size="21" font-weight="500" fill="#e8f2ff" text-anchor="start">MPU9250 · I²C</text>
<text x="109" y="703" font-size="16" font-weight="400" fill="#b2c7e0" text-anchor="start">Acceleration / angular velocity</text>
<text x="109" y="726" font-size="21" font-weight="500" fill="#e8f2ff" text-anchor="start">MAX31865 + PT100 · SPI</text>
<text x="109" y="750" font-size="16" font-weight="400" fill="#b2c7e0" text-anchor="start">Probe temperature</text>
